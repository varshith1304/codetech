<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODTECH Task-1 Weather API App</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
background:linear-gradient(135deg,#74ebd5,#ACB6E5);
}

.container{

width:100%;
max-width:450px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,0.2);

}

h1{

text-align:center;
margin-bottom:20px;

}

.search{

display:flex;
gap:10px;
margin-bottom:20px;

}

.search input{

flex:1;
padding:12px;
border:1px solid gray;
border-radius:8px;
font-size:16px;

}

.search button{

padding:12px 20px;
border:none;
border-radius:8px;
background:#007bff;
color:white;
cursor:pointer;

}

.search button:hover{

background:#0056b3;

}

.card{

background:#f4f4f4;
padding:20px;
border-radius:15px;
text-align:center;

}

.card img{

width:100px;

}

@media(max-width:500px){

.search{

flex-direction:column;

}

.search button{

width:100%;

}

}

</style>
</head>

<body>

<div class="container">

<h1>Weather App</h1>

<div class="search">

<input
type="text"
id="city"
placeholder="Enter city name">

<button onclick="getWeather()">
Search
</button>

</div>

<div id="weather" class="card">

<h3>Search a city</h3>

</div>

</div>

<script>

async function getWeather(){

let city=
document.getElementById("city").value;

if(city===""){

alert("Please enter city name");

return;

}

let apiKey="YOUR_API_KEY";

let url=
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

try{

let response=
await fetch(url);

let data=
await response.json();

if(data.cod=="404"){

document.getElementById("weather")
.innerHTML=

"<h3>City not found</h3>";

return;

}

document.getElementById("weather")
.innerHTML=

`

<h2>${data.name}</h2>

<img src=
"https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png">

<h2>${data.main.temp} °C</h2>

<p>
${data.weather[0].description}
</p>

<br>

<p>
Humidity:
${data.main.humidity}%
</p>

<p>
Wind Speed:
${data.wind.speed} km/h
</p>

`;

}

catch(error){

document.getElementById("weather")
.innerHTML=

"<h3>Error loading data</h3>";

}

}

</script>

</body>
</html>
